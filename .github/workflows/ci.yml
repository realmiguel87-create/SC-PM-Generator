name: CI

on:
  push:
    branches: [Artwork-Workflow-Rep]
  pull_request:
    branches: [Artwork-Workflow-Rep]

jobs:
  api:
    name: Build & test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore src/Api/SCPM.sln
      - name: Build
        run: dotnet build src/Api/SCPM.sln --no-restore -c Release
      - name: Test
        run: dotnet test tests/SCPM.UnitTests/SCPM.UnitTests.csproj --no-build -c Release --logger "trx"

  migrate:
    name: Apply EF Core migrations to a real SQL Server
    runs-on: ubuntu-latest
    # Compiling a migration proves it's syntactically valid C#; it does not prove the SQL it
    # generates is valid. This job runs `dotnet ef database update` against a real SQL Server
    # service container — this is exactly how Phase 5 caught a genuine "multiple cascade paths"
    # error (SQL Server error 1785) that a clean `dotnet build` had no way to see.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Passw0rd!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 9.0.0
      - name: dotnet ef database update
        working-directory: src/Api
        run: |
          dotnet ef database update \
            --project SCPM.Infrastructure --startup-project SCPM.Api \
            --connection "Server=127.0.0.1,1433;Database=SCPM;User Id=sa;Password=Ci_Passw0rd!;TrustServerCertificate=True"

  integration:
    name: Integration & RBAC tests (real SQL Server, real ASP.NET Core pipeline)
    runs-on: ubuntu-latest
    # WebApplicationFactory boots the actual SCPM.Api host end to end — real DI container, real
    # RequireRole() policies, real EntraClaimsTransformation — against this service container,
    # with only Entra ID token validation swapped for a test scheme. This is what caught the
    # seeded Role.Name values not matching RequireRole()'s policy names for every multi-word
    # role during Phase 7; that class of bug is invisible to handler-level unit tests, which
    # never touch ASP.NET Core's authorization pipeline or real role-string matching.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Passw0rd!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Test
        env:
          SCPM_INTEGRATIONTESTS_CONNECTION: "Server=127.0.0.1,1433;Database=SCPM_IntegrationTests;User Id=sa;Password=Ci_Passw0rd!;TrustServerCertificate=True"
        run: dotnet test tests/SCPM.IntegrationTests/SCPM.IntegrationTests.csproj -c Release --logger "trx"

  web:
    name: Build & lint Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  web-e2e-smoke:
    name: Playwright smoke test (Web)
    runs-on: ubuntu-latest
    # Frontend-only smoke test — no backend API is started (MSAL auth isn't wired into the
    # frontend yet, so even a live API would 401 every request here; see
    # src/Web/playwright.config.ts for the full reasoning). This verifies the built app boots
    # and every top-level route is navigable without an uncaught error, which unit/integration
    # tests can't: those never load the app in an actual browser.
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/Web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Built as its own step, separate from `npx playwright test` below — chaining build+preview
      # inside Playwright's webServer.command hid a hang behind one opaque "timed out waiting for
      # server" failure with no way to tell which half was stuck. This way a build problem fails
      # here, visibly, before Playwright ever starts.
      - run: npm run build
      - run: npx playwright test
