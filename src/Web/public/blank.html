<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Signing in…</title>
  </head>
  <body>
    <!--
      Deliberately empty. This is the redirect target for MSAL's sign-in popup.

      Without it the popup redirects back to "/", which loads the entire React app — every
      module, every dependency — inside the popup window, purely so MSAL can read the token
      fragment out of the URL and post it back to the parent window. MSAL waits 60 seconds for
      that handoff and then fails with BrowserAuthError: timed_out.

      That is not hypothetical: it is exactly how sign-in failed during first real setup of this
      app. The popup authenticated correctly every time, and the timeout looked indistinguishable
      from a consent or tenant misconfiguration.

      Serving a page with nothing on it makes the handoff immediate. This file must also be
      registered as a redirect URI on the Entra ID app registration (SPA platform), alongside the
      app's own origin.
    -->
  </body>
</html>
