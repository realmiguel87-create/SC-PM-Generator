name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: Build & test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore src/Api/SCPM.sln
      - name: Build
        run: dotnet build src/Api/SCPM.sln --no-restore -c Release
      - name: Test
        run: dotnet test tests/SCPM.UnitTests/SCPM.UnitTests.csproj --no-build -c Release --logger "trx"

  web:
    name: Build & lint Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
